<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | Chezan Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-soft: #dbeafe;
            --primary-dark: #1d4ed8;
            --neutral-50: #f8fafc;
            --neutral-200: #e2e8f0;
            --neutral-500: #64748b;
            --neutral-700: #334155;
            --neutral-800: #1e293b;
        }
        * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background: var(--neutral-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .reset-container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo i {
            font-size: 2.5rem;
            color: var(--primary);
        }
        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--neutral-800);
            margin-top: 0.5rem;
        }
        .form-label {
            font-weight: 500;
            color: var(--neutral-700);
            font-size: 0.875rem;
        }
        .form-control {
            border-radius: 10px;
            border: 1px solid var(--neutral-200);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
            padding: 0.875rem;
            border-radius: 10px;
            width: 100%;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .alert-success { background: #d1fae5; color: #047857; }
        .alert-danger { background: #fee2e2; color: #991b1b; }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: var(--neutral-500);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link a:hover {
            color: var(--primary);
        }
        .password-requirements {
            font-size: 0.8rem;
            color: var(--neutral-500);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <i class="fas fa-layer-group"></i>
            <h1>Create New Password</h1>
        </div>

        <div th:if="${success}" class="alert alert-success mb-3" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

        <div th:if="${errors}" class="alert alert-danger mb-3">
            <ul class="mb-0">
                <li th:each="err : ${errors}" th:text="${err.defaultMessage}"></li>
            </ul>
        </div>

        <div th:if="${token != null}">
            <form th:action="@{/api/auth/reset-password}" th:object="${resetRequest}" method="post">
                <input type="hidden" th:field="*{token}" th:value="${token}">

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" th:field="*{newPassword}" class="form-control" placeholder="Enter new password" required>
                    <div class="password-requirements">
                        Password must be at least 8 characters and contain uppercase, lowercase, and numbers.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-lock me-2"></i>Reset Password
                </button>
            </form>
        </div>

        <div th:if="${token == null && error == null}">
            <div class="alert alert-danger">
                Invalid or expired reset link. Please request a new password reset.
            </div>
        </div>

        <div class="back-link">
            <a th:href="@{/login}"><i class="fas fa-arrow-left me-1"></i>Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
