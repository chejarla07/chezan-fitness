# Development Profile Configuration
spring:
  config:
    activate:
      on-profile: dev

  # SQLite Database for Development
  datasource:
    url: jdbc:sqlite:zuora_dev.sqlite3
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true

# Zuora API Credentials (from environment variables)
zuora:
  client-id: ${ZUORA_CLIENT_ID}
  client-secret: ${ZUORA_CLIENT_SECRET}

# JWT Secret (from environment variable, with dev default)
jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production-environment}

# Google Maps API Key
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

# Logging - Development level
logging:
  level:
    com.example: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# SendGrid API Key (from environment variable)
sendgrid:
  api-key: ${SENDGRID_API_KEY:}

# App configuration
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin123}
  cookie:
    secure: false  # Set to true in production for HTTPS